name: Package Jar with Maven and Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Permissions are required to create a release and upload assets
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 24
        uses: actions/setup-java@v3
        with:
          java-version: "24"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file PenguinRunner/pom.xml -DskipTests

      - name: Prepare Release Assets
        run: |
          mkdir staging
          cp PenguinRunner/target/*.jar staging/

      # Optional: Keeps the zip artifact in your Action runs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: staging

      # NEW: Create the GitHub Release and upload the jar
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          files: staging/*.jar
